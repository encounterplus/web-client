@for (activeCombatant of activeCombatants; track activeCombatant; let i = $index) {<app-combatant [combatant]="activeCombatant.combatant" [attr.data-id]="activeCombatant.initiative.id" [ngClass]="{'combatant-turned': activeCombatant.initiative.id == state.game.initiativeId}" class="combatant role-{{activeCombatant.combatant.role}} d-flex align-items-stretch" (click)="open(i)"></app-combatant>}
