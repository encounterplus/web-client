<ng-container *ngIf="(lightboxState$ | async) as state">
  <div 
    *ngIf="state.isOpen"
    class="lightbox-backdrop" 
    (click)="onBackdropClick()"
    (keydown)="onKeyDown($event)"
    tabindex="0"
    role="dialog"
    aria-modal="true"
    aria-label="Image lightbox">
    
    <button 
      class="lightbox-close" 
      aria-label="Close lightbox"
      (click)="onCloseButtonClick()">
      ✕
    </button>

    <div class="lightbox-content" (click)="onImageClick($event)">
      <img 
        [src]="state.imageUrl" 
        [alt]="state.imageAlt"
        class="lightbox-image">
    </div>
  </div>
</ng-container>
