<div class="modal-header" style="padding: 0.4rem 1rem;" appDraggable>
    <h5 class="modal-title" id="modal-basic-title">{{title}}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeWindow.emit()"></button>
</div>

<div
  class="modal-body entity-body"
  [class.auto-size]="autoSize"
  [class.has-description]="description"
  [style.height.px]="autoSize && !description ? frameHeight : null"
>
    @if (description) {
      <div class="effect-description">{{description}}</div>
    } @else {
      <iframe #entityFrame [src]="url|safe: 'resourceUrl'" width="100%" height="100%" [title]="title" (load)="frameLoaded(entityFrame)"></iframe>
    }

    @if (frameLoading) {
      <div class="frame-loading"><i class="fa fa-circle-o-notch fa-spin" aria-hidden="true"></i> Loading…</div>
    }
</div>
