<div class="title-bar" (pointerdown)="startMove($event)" [title]="compact() ? '' : win().maximized ? 'Double-tap to restore' : 'Double-tap to fill the screen'">
  <!-- at the far end from close, so a touch meant for one never opens the other -->
  @if (win().externalUrl) {
    <a class="open-external" [href]="win().externalUrl" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open in a new tab">&#8599;</a>
  }
  <!-- only once the content went elsewhere, such as a link followed in a sheet -->
  @if (ref.back(); as back) {
    <button type="button" class="nav-back" title="Back to where it started" aria-label="Back to where it started" (click)="back()">&#8617;</button>
  }
  <span class="title">{{ win().title }}</span>
  <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="close()"></button>
</div>

<div class="content">
  <ng-container *ngComponentOutlet="win().component; inputs: win().inputs ?? {}"></ng-container>
  <!-- takes the pointer instead of the content: in a window behind, so a click brings it forward,
       and in every window while one is dragged, so no iframe takes the pointer's events -->
  <div class="shield"></div>
</div>

@if (!filled()) {
  @for (edge of edges; track edge) {
    <div class="resize resize-{{ edge }}" (pointerdown)="startResize($event, edge)"></div>
  }
}
